# Near-prod стенд для отладки мини-аппа (initData / лента / публикация).
#   docker compose -f docker-compose.testing.yml up --build
#
# Что поднимается:
#   - postgres   : та же схема, что в проде (cmd/migrate применяется ботом на старте)
#   - bot        : Go-сервис ms_leo + HTTP API мини-аппа на :8080 (PORT=8080)
#   - tracker    : ms_tracker — агент доски, сдачи шлёт боту на /api/miniapp/board/notify.
#                  Задачи выполняет Claude Agent SDK, запасной — Cursor SDK.
#
# ВАЖНО про Claude: положи в .env CLAUDE_CODE_OAUTH_TOKEN (токен подписки из
# `claude setup-token`, начинается с sk-ant-oat) или ANTHROPIC_API_KEY. Без них
# трекер уйдёт на Cursor (нужен CURSOR_API_KEY). Модель — CLAUDE_MODEL
# (по умолчанию claude-opus-5-5), TRACKER_AGENT=cursor — начинать с Cursor.
# Для коммитов и пуша веток задач нужен GITHUB_PERSONAL_TOKEN.
#   - miniapp    : статика Vite на :3000, VITE_MINIAPP_API_URL → http://localhost:8080
#
# ВАЖНО про токен: ms_leo при старте дёргает Telegram getMe, поэтому нужен НАСТОЯЩИЙ
# тестовый бот-токен от @BotFather. Положи его в .env как FAT_LEOPARD_API_TOKEN.
# Без валидного токена контейнер bot не стартует (ограничение Telegram, не бага кода).
#
# ВАЖНО про initData в реальном Telegram: WebView требует https. Для теста с телефона
# проброс https-туннелем (cloudflared/ngrok) на :3000 (miniapp) и :8080 (api), и впиши
# https-URL API в VITE_MINIAPP_API_URL ниже, затем пересобери miniapp.

services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=leo_bot_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leo_bot_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: ./ms_leo
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - FAT_LEOPARD_API_TOKEN=${FAT_LEOPARD_API_TOKEN}
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/leo_bot_db?sslmode=disable
      - LOG_LEVEL=info
      - PAYWALL_ENABLED=false
      - MINIAPP_PUBLIC_BASE_URL=${MINIAPP_PUBLIC_BASE_URL:-http://localhost:8080}
      - TRACKER_URL=http://tracker:8080
      - TRACKER_SECRET=${TRACKER_SECRET:-dev-tracker-secret}
      - OWNER_ID=${OWNER_ID:-0}
      - ADMIN_IDS=${ADMIN_IDS:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  tracker:
    build:
      context: ./ms_tracker
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/leo_bot_db?sslmode=disable
      - TRACKER_SECRET=${TRACKER_SECRET:-dev-tracker-secret}
      - LEO_NOTIFY_URL=http://bot:8080/api/miniapp/board/notify
      - NOTIFY_SECRET=${TRACKER_SECRET:-dev-tracker-secret}
      - BOARD_REPO=${BOARD_REPO:-fuserwyn/Fat-Leopard}
      - BOARD_BRANCH=main
      # Исполнитель задач: Claude Agent SDK (основной), Cursor SDK (запасной).
      - TRACKER_AGENT=${TRACKER_AGENT:-claude}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      - CLAUDE_MAX_TURNS=${CLAUDE_MAX_TURNS:-80}
      - CURSOR_API_KEY=${CURSOR_API_KEY:-}
      - GITHUB_PERSONAL_TOKEN=${GITHUB_PERSONAL_TOKEN:-}
      - RAILWAY_API_TOKEN=${RAILWAY_API_TOKEN:-}
      - RAILWAY_PROJECT_ID=${RAILWAY_PROJECT_ID:-}
      - RAILWAY_ENVIRONMENT_ID=${RAILWAY_ENVIRONMENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

  miniapp:
    build:
      context: ./miniapp
      dockerfile: Dockerfile.miniapp
      args:
        # Для локального браузера — localhost. Для теста в реальном Telegram замени
        # на https-URL туннеля до сервиса bot и пересобери (--build).
        VITE_MINIAPP_API_URL: ${VITE_MINIAPP_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - bot
